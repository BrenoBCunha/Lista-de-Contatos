[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"


[project]
name = "lista-de-contatos-poo"
version = "0.1.0"
description = "Agenda de contatos em Python desenvolvida com POO"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich",
]


[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]


[tool.setuptools.packages.find]
include = ["lista_contatos*"]


[tool.pytest.ini_options]
testpaths = ["testes"]
addopts = "-q"


[tool.coverage.run]
source = ["lista_contatos"]


[tool.coverage.report]
show_missing = true